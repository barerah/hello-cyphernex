name: Docker Build and Test

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build . -t cyphernex-app:latest

      - name: Test Python app in Docker
        run: |
          output=$(docker run --rm cyphernex-app:latest)
          echo "$output"
          echo "$output" | grep "Hello CypherNex"
          echo "$output" | grep "Current time:"